<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Crow · Blue Plane</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
    #flight-hint { position: fixed; inset-inline: 16px; bottom: max(4vh, env(safe-area-inset-bottom));
      margin: 0; color: #f8fbff; text-align: center; font: 500 13px/1.4 system-ui;
      text-shadow: 0 1px 4px #12304b; pointer-events: none; }
    @media (max-aspect-ratio: 3/4) { #flight-hint { bottom: 22vh; } }
    #error { position: fixed; inset: 45% 5% auto; margin: 0; color: #fff; text-align: center; font: 16px/1.5 system-ui; }
  </style>
</head>
<body>
  <canvas aria-label="Playable crow on an infinite blue plane. Use WASD or arrow keys to move. Hold Shift to run. Press Space to jump, Shift in the air to fly, and Space to land. While flying, steer with A and D or the mouse. S slows you down. Move the mouse above center to climb or below center to descend and land. Drag to orbit and scroll or pinch to zoom."></canvas>
  <p id="flight-hint" hidden>Shift while jumping to start flying</p>
  <p id="error" role="alert" hidden>The crow scene could not load. Reload in a browser with WebGL 2 enabled.</p>
  <script type="module" src="/src/splat/crowPlane.js"></script>
</body>
</html>
