<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><link rel="icon" href="data:,"><title>Cliff · Four Seasons</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#error{position:fixed;inset:45% 10%;color:#ddd;text-align:center;font:16px/1.5 system-ui}</style>
<style>
#physics-controls{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100vw - 64px);padding:12px 16px;border-radius:12px;color:#f5f3e9;background:rgba(24,31,32,.88);font:13px/1.5 system-ui;box-shadow:0 2px 12px #0002}
#physics-controls summary{cursor:pointer;min-height:28px;align-content:center}#physics-controls p{margin:6px 0 10px;color:#d6ded8}#physics-controls .actions{display:flex;flex-wrap:wrap;gap:6px}
#physics-controls button{font:inherit;color:inherit;background:#ffffff12;border:1px solid #ffffff35;border-radius:6px;min-height:36px;padding:6px 10px;cursor:pointer}#physics-controls button:hover{background:#ffffff25}#physics-controls button:active{transform:scale(.96)}#physics-controls :focus-visible{outline:2px solid #ffe4a8;outline-offset:3px}#physics-controls button:disabled{opacity:.45;cursor:wait}#physics-controls kbd{font:inherit;color:#d6ded8;margin-left:6px}#physics-status{display:block;margin-top:8px;color:#d6ded8}
@media(pointer:coarse){#physics-controls button{min-height:44px}}@media(prefers-reduced-motion:reduce){#physics-controls button:active{transform:none}}
</style>
</head>
<body>
<canvas tabindex="0" aria-label="A painted cliff and meadow through four seasons. Drag to look around. WASD or arrows to walk, Shift to run, Space to jump, Shift in the air to fly."></canvas>
<details id="physics-controls" open>
<summary>Cliff physics</summary>
<p>WASD to walk · Shift to run · Space to jump</p>
<div class="actions" aria-label="Physics actions">
<button type="button" data-physics="KeyB" disabled>Drop rock <kbd>B</kbd></button>
<button type="button" data-physics="KeyX" disabled>Break nearby rock <kbd>X</kbd></button>
<button type="button" data-physics="KeyH" disabled>Toggle fire <kbd>H</kbd></button>
<button type="button" data-physics="KeyG" disabled>Gust <kbd>G</kbd></button>
<button type="button" data-physics="KeyN" disabled>Toggle snow <kbd>N</kbd></button>
</div>
<output id="physics-status" aria-live="off">Loading the cliff…</output>
</details>
<p id="error" role="alert" hidden>The scene could not load. Reload in a browser with WebGL 2 enabled.</p>
<script type="module" src="/src/splat/cliffPresentation.js"></script>
</body>
</html>
